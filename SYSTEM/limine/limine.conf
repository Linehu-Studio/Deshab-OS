timeout: 0
serial: yes
verbose: yes

/UTSM boot
    protocol: limine
    kernel_path: boot():/boot/utsm.elf
    module_path: boot():/driver/manifest.json
    module_cmdline: dkm:manifest

    module_path: boot():/driver/platform/timer.drv
    module_cmdline: dkm:timer
    module_path: boot():/driver/platform/apic.drv
    module_cmdline: dkm:apic
    module_path: boot():/driver/platform/acpi.drv
    module_cmdline: dkm:acpi
    module_path: boot():/driver/bus/pci.drv
    module_cmdline: dkm:pci
    module_path: boot():/driver/console/console_fb.drv
    module_cmdline: dkm:console_fb
    module_path: boot():/driver/block/ahci.drv
    module_cmdline: dkm:ahci
    module_path: boot():/driver/block/nvme.drv
    module_cmdline: dkm:nvme
    module_path: boot():/driver/fs/bootfs.drv
    module_cmdline: dkm:bootfs
    module_path: boot():/driver/fs/vfs.drv
    module_cmdline: dkm:vfs
    module_path: boot():/driver/fs/fat32.drv
    module_cmdline: dkm:fat32
    module_path: boot():/driver/fs/devfs.drv
    module_cmdline: dkm:devfs
    module_path: boot():/driver/net/e1000.drv
    module_cmdline: dkm:e1000
    module_path: boot():/driver/net/virtio_net.drv
    module_cmdline: dkm:virtio_net
    module_path: boot():/driver/net/ath9k.drv
    module_cmdline: dkm:ath9k
    module_path: boot():/driver/input/ps2kbd.drv
    module_cmdline: dkm:ps2kbd
    module_path: boot():/system/deshab64/deshab.elf
    module_cmdline: dsk:main
    module_path: boot():/driver/test.fat32
    module_cmdline: dkm:test_fat32

    # Linux 6.6 LTS guest kernel (for UTSM+Linux dual-kernel architecture)
    # Uncomment after building Linux via CODE/linux/build.sh
    # module_path: boot():/boot/linux-bzImage
    # module_cmdline: linux:bzImage
    # module_path: boot():/boot/linux-initrd.img
    # module_cmdline: linux:initrd
